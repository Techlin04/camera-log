<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Camera Log</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       TOP BAR
  ========================= -->

  <header class="topbar">

    <div class="topbar-left">

      <h1>CAMERA LOG</h1>

      <p id="currentProject">
        No Project
      </p>

    </div>

    <button
      class="secondary-btn"
      onclick="newProject()">
      NEW PROJECT
    </button>

  </header>


  <main class="container">


    <!-- =========================
         PROJECT
    ========================= -->

    <section class="card project-card">

      <div class="section-title">

        <div class="section-heading">

          <span class="section-label">
            PROJECT
          </span>

          <span
            id="projectSummary"
            class="section-summary">
            No Project
          </span>

        </div>

        <button
          class="edit-btn"
          onclick="toggleSection('projectContent')">
          EDIT
        </button>

      </div>


      <div
        id="projectContent"
        class="content collapsed">

        <div class="grid">

          <label>
            DATE
            <input id="date" type="date">
          </label>

          <label>
            PROJECT
            <input id="project" type="text">
          </label>

          <label>
            DIRECTOR
            <input id="director" type="text">
          </label>

          <label>
            DP
            <input id="dp" type="text">
          </label>

          <label>
            CAMERA
            <input id="camera" type="text">
          </label>

        </div>

      </div>

    </section>



    <!-- =========================
         SCENE
    ========================= -->

    <section class="card scene-card">

      <div class="section-title">
        <div class="section-heading">
          <span class="section-label">SCENE</span>
          <div class="current-info">
            <span id="currentScene" class="current-value">No Scene</span>
            <span id="sceneSummary" class="setting-summary">—</span>
          </div>
        </div>

                <div class="section-actions">

                  <button
                    class="new-btn"
                    onclick="newScene()">
                    NEW
                  </button>

                  <button
                    class="edit-btn"
                    onclick="editScene()">
                    EDIT
                  </button>

                </div>
      </div>


      <div
        id="sceneContent"
        class="content collapsed">

        <div class="grid">

          <label>
            SCENE
            <input id="scene" type="text">
          </label>

        </div>


        <h3>SCENE SETUP</h3>


        <div class="grid">

          <label>
            FPS
            <input id="fps" type="text">
          </label>

          <label>
            SHUTTER
            <input id="shutter" type="text">
          </label>

          <label>
            ISO
            <input id="iso" type="text">
          </label>

          <label>
            COLOR TEMP
            <input id="colorTemp" type="text">
          </label>

          <label>
            LUT
            <input id="lut" type="text">
          </label>

          <label>
            RESOLUTION
            <input id="resolution" type="text">
          </label>

          <label>
            FORMAT
            <input id="format" type="text">
          </label>

          <label>
            ASPECT RATIO
            <input id="aspectRatio" type="text">
          </label>

        </div>

      </div>

    </section>



    <!-- =========================
         SHOT
    ========================= -->

    <section class="card shot-card">

      <div class="section-title">
        <div class="section-heading">
          <span class="section-label">SHOT</span>
          <div class="current-info">
            <span id="currentShot" class="current-value">No Shot</span>
            <span id="shotSummary" class="setting-summary">—</span>
          </div>
        </div>

        <button
          class="edit-btn"
          onclick="editShot()">
          EDIT
        </button>
      </div>


      <div
        id="shotContent"
        class="content collapsed">

        <div class="grid">

          <label>
            SHOT
            <input id="shot" type="text">
          </label>

        </div>


        <h3>SHOT SETUP</h3>


        <div class="grid">

          <label>
            LENS
            <input id="lens" type="text">
          </label>

          <label>
            FILTERS
            <input id="filters" type="text">
          </label>

          <label>
            FOCUS
            <input id="focus" type="text">
          </label>

          <label>
            HEIGHT
            <input id="height" type="text">
          </label>

          <label>
            TILT
            <input id="tilt" type="text">
          </label>

          <label>
            STOP
            <input id="stop" type="text">
          </label>

        </div>

      </div>

    </section>



    <!-- =========================
         TAKE
    ========================= -->

    <section class="card take-card">

      <div class="take-header">

        <h2>TAKE</h2>

        <span class="take-hint">
          Save current take
        </span>

      </div>


      <div class="grid take-grid">

        <label>
          TAKE
          <input
            id="take"
            type="text"
            inputmode="numeric"
            autocomplete="off">
        </label>

        <label>
          ROLL
          <input
            id="roll"
            type="text"
            autocomplete="off">
        </label>

        <label>
          CLIP
          <input
            id="clip"
            type="text"
            autocomplete="off">
        </label>

      </div>


      <label class="note-field">

        NOTE

        <textarea
          id="note"
          placeholder="Optional note..."></textarea>

      </label>


      <button
        class="save-btn"
        onclick="saveTake()">

        SAVE TAKE

      </button>

    </section>



    <!-- =========================
         LOG HISTORY
    ========================= -->

    <section class="card history-card">

      <div class="section-title">

        <div class="section-heading">

          <span class="section-label">
            LOG
          </span>

          <span class="section-summary">
            HISTORY
          </span>

        </div>

      </div>


      <div id="history">

        <p class="empty">
          No logs yet.
        </p>

      </div>

    </section>


  </main>


  <script src="app.js"></script>

</body>

</html>
